# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: BRISE-CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Set environmental variables
        shell: bash -el {0}
        run: |
          test_vars=$(cat deployment_settings/CITestDeployment.json | jq -r 'to_entries | map("\(.key)=\(.value|tostring)") | .[]')
          echo "$test_vars" >> $GITHUB_ENV
          echo $GITHUB_ENV

      - name: Start Services with Docker Compose
        run: |
          ./brise.sh up -m test
          docker ps
          export REAL_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' mongo-db-test)
          echo "BRISE_DATABASE_HOST=$REAL_IP" >> $GITHUB_ENV
      # Setup Python
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      # Set up Miniconda
      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v2
        with:
          activate-environment: brise-260
          environment-file: ./main_node/environment.yml
          python-version: 3.12
          miniconda-version: "latest"
          auto-update-conda: true
          auto-activate-base: false
      - name: Lint with flake8
        shell: bash -el {0}
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --config tox.ini --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=50 --max-line-length=300 --statistics
      - name: Test with pytest
        shell: bash -el {0}
        run: |
          docker ps
          cd main_node
          pytest --cov=. --cov-report=xml:coverage.xml --cov-report=term || TEST_EXIT_CODE=$?
          if [ -n "${TEST_EXIT_CODE:-}" ]; then exit $TEST_EXIT_CODE; fi
      # Fetch coverage badge svg
      - name: Extract coverage %
        shell: bash -el {0}
        run: |
          cd main_node
          LINE_RATE=$(grep -oP 'line-rate="\K[0-9]+(\.[0-9]+)?' coverage.xml | head -n1 || echo 0)
          PERCENT=$(awk "BEGIN{printf \"%d\", ($LINE_RATE*100)+0.5}")
          echo "coverage=${PERCENT}"
          cd ..
          mkdir -p badge-data
  
          # Choose color based on percentage
          # 90-100% brightgreen
          # 80-89% green
          # 70-79% yellowgreen
          # 60-69% yellow
          # 50-59%  orange
          # <50% red
          if (( PERCENT >= 90 )); then
              COLOR=brightgreen
          elif (( PERCENT >= 80 )); then
              COLOR=green
          elif (( PERCENT >= 70 )); then
              COLOR=yellowgreen
          elif (( PERCENT >= 60 )); then
              COLOR=yellow
          elif (( PERCENT >= 50 )); then
              COLOR=orange
          else
              COLOR=red
          fi
  
          # create url with percentage
          n=$(($PERCENT+0))
          url="https://img.shields.io/badge/Code%20Coverage-${PERCENT}%25-${COLOR}?style=flat"
          curl -sSL --fail "$url" -o badge-data/coverage.svg
      # Commit updated badge svg
      - name: Commit badge data
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update coverage badge"
          file_pattern: badge-data/coverage.svg
